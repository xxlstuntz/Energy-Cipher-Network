kind = "web"
previewPath = "/"
title = "369 Energy AI"
version = "1.0.0"
id = "artifacts/energy-ai"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24742

[services.development]
run = "pnpm --filter @workspace/energy-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/energy-ai", "run", "build" ]
publicDir = "artifacts/energy-ai/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24742"
BASE_PATH = "/"
