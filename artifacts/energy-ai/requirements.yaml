packages:
  "framer-motion": "Required for the mystical, fluid energy animations and page transitions"
  "lucide-react": "Icons for the chat and navigation"
  "clsx": "Utility for constructing className strings conditionally"
  "tailwind-merge": "Utility to merge tailwind classes safely"

images:
